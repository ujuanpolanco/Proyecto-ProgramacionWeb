<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card card-body p-4">
      <h1 class="h3 mb-3">Crear cuenta</h1>

      @if (error) {
        <div class="alert alert-danger" role="alert">{{ error }}</div>
      }

      <form #formulario="ngForm" (ngSubmit)="registrar(formulario)" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo *</label>
          <input id="nombre" name="nombre" class="form-control" required minlength="3" autocomplete="name"
                 [(ngModel)]="nombre" #campoNombre="ngModel"
                 [class.is-invalid]="campoNombre.invalid && (campoNombre.touched || formulario.submitted)">
          <div class="invalid-feedback">Escribe tu nombre (mínimo 3 caracteres).</div>
        </div>

        <div class="row">
          <div class="col-md-7 mb-3">
            <label for="email" class="form-label">Correo electrónico *</label>
            <input id="email" name="email" type="email" class="form-control" required email autocomplete="email"
                   [(ngModel)]="email" #campoEmail="ngModel"
                   [class.is-invalid]="campoEmail.invalid && (campoEmail.touched || formulario.submitted)">
            <div class="invalid-feedback">Escribe un correo válido.</div>
          </div>
          <div class="col-md-5 mb-3">
            <label for="telefono" class="form-label">Celular *</label>
            <input id="telefono" name="telefono" type="tel" class="form-control" required pattern="3[0-9]{9}"
                   autocomplete="tel"
                   [(ngModel)]="telefono" #campoTelefono="ngModel"
                   [class.is-invalid]="campoTelefono.invalid && (campoTelefono.touched || formulario.submitted)">
            <div class="invalid-feedback">10 dígitos, empezando por 3.</div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="password" class="form-label">Contraseña *</label>
            <input id="password" name="password" type="password" class="form-control" required minlength="8"
                   autocomplete="new-password"
                   [(ngModel)]="password" #campoPassword="ngModel"
                   [class.is-invalid]="campoPassword.invalid && (campoPassword.touched || formulario.submitted)">
            <div class="invalid-feedback">Mínimo 8 caracteres.</div>
          </div>
          <div class="col-md-6 mb-3">
            <label for="confirmacion" class="form-label">Repite la contraseña *</label>
            <input id="confirmacion" name="confirmacion" type="password" class="form-control" required
                   autocomplete="new-password"
                   [(ngModel)]="confirmacion" #campoConfirmacion="ngModel"
                   [class.is-invalid]="(campoConfirmacion.touched || formulario.submitted) && password !== confirmacion">
            <div class="invalid-feedback">Las contraseñas no coinciden.</div>
          </div>
        </div>

        <div class="form-check mb-3">
          <input id="aceptaDatos" name="aceptaDatos" type="checkbox" class="form-check-input" required
                 [(ngModel)]="aceptaDatos" #campoAcepta="ngModel"
                 [class.is-invalid]="campoAcepta.invalid && formulario.submitted">
          <label for="aceptaDatos" class="form-check-label">
            Autorizo a KHAZA el tratamiento de mis datos personales según el
            <a routerLink="/privacidad" target="_blank">aviso de privacidad</a> (Ley 1581 de 2012). *
          </label>
          <div class="invalid-feedback">Debes aceptar para crear la cuenta.</div>
        </div>

        <button type="submit" class="btn btn-khaza w-100">Crear cuenta</button>
      </form>

      <p class="mt-3 mb-0 text-center">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
  </div>
</div>
