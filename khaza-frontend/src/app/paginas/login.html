<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card card-body p-4">
      <h1 class="h3 mb-3">Iniciar sesión</h1>

      @if (error) {
        <div class="alert alert-danger" role="alert">{{ error }}</div>
      }

      <form #formulario="ngForm" (ngSubmit)="ingresar(formulario)" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input id="email" name="email" type="email" class="form-control" required email autocomplete="email"
                 [(ngModel)]="email" #campoEmail="ngModel"
                 [class.is-invalid]="campoEmail.invalid && (campoEmail.touched || formulario.submitted)">
          <div class="invalid-feedback">Escribe un correo válido.</div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" name="password" type="password" class="form-control" required
                 autocomplete="current-password"
                 [(ngModel)]="password" #campoPassword="ngModel"
                 [class.is-invalid]="campoPassword.invalid && (campoPassword.touched || formulario.submitted)">
          <div class="invalid-feedback">Escribe tu contraseña.</div>
        </div>
        <button type="submit" class="btn btn-khaza w-100">Entrar</button>
      </form>

      <!-- El inicio de sesión con Google (OAuth 2.0) se agrega en la Fase 5 -->

      <p class="mt-3 mb-0 text-center">¿No tienes cuenta? <a routerLink="/registro">Créala aquí</a></p>
    </div>

    <p class="small text-muted mt-3">
      Datos de prueba: <code>cliente&#64;khaza.com</code> / <code>cliente123</code> ·
      <code>admin&#64;khaza.com</code> / <code>admin123</code>
    </p>
  </div>
</div>
