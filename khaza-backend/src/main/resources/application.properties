spring.application.name=khaza-backend

# ===== HTTPS =====
# Certificado autofirmado para desarrollo (creado con keytool, ver README).
# El navegador muestra una advertencia la primera vez: hay que darle "Continuar".
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:khaza.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=khaza2026
server.ssl.key-alias=khaza

# ===== Base de datos: MySQL =====
# La base "khaza" se crea con el script base-datos/khaza.sql.
# Se usa el usuario khaza_app (no root): solo puede leer y modificar datos.
spring.datasource.url=jdbc:mysql://localhost:3306/khaza?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=khaza_app
spring.datasource.password=Khaza2026*

# JPA / Hibernate
# none = Hibernate NO crea ni cambia tablas: las tablas y los triggers los crea el script SQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Mostrar el mensaje de error en las respuestas (ej: "Producto no encontrado")
server.error.include-message=always
server.error.include-binding-errors=always

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# ===== JWT =====
# Clave secreta con la que se firman los tokens (256 bits en Base64) y su duración.
khaza.jwt.secreto=9JB1enUolChWz13kInmOkpl3PtVSMWmwI3KGdOiPrBc=
khaza.jwt.horas=8

# Dirección del front-end (para CORS y para volver después de entrar con Google)
khaza.frontend.url=https://localhost:4200

# ===== OAuth 2.0 con Google =====
# Los datos se crean en https://console.cloud.google.com (ver README).
# Se leen de variables de entorno para no dejarlos escritos en el código.
# El front-end (proxy de Angular) reenvía /oauth2 y /login/oauth2 a este servidor, así que la
# URI de redirección que hay que registrar en Google es: https://localhost:4200/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:falta-configurar}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:falta-configurar}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
